<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#33291e"/>
      <stop offset="1" stop-color="#14100c"/>
    </radialGradient>
    <style>
      .cream { fill: #efe4c8; }
      .dark { fill: #1b1611; }
      .title { font-family: 'PT Serif', Georgia, serif; font-weight: 700; font-size: 56px; letter-spacing: 3px; fill: #efe4c8; }
      .ru { font-family: 'Montserrat', 'Segoe UI', sans-serif; font-weight: 700; font-size: 52px; letter-spacing: 1px; fill: #efe4c8; }
    </style>
  </defs>

  <!-- фон и рамка -->
  <rect width="512" height="512" rx="44" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="34" fill="none" stroke="#c9b98f" stroke-width="4"/>

  <text class="title" x="256" y="104" text-anchor="middle">RAILROADER</text>

  <!-- дым -->
  <g fill="#8c806d" opacity="0.75">
    <circle cx="372" cy="138" r="13"/>
    <circle cx="349" cy="126" r="17"/>
    <circle cx="318" cy="120" r="14"/>
    <circle cx="292" cy="124" r="10"/>
  </g>

  <!-- паровоз (смотрит вправо) -->
  <g class="cream">
    <!-- будка -->
    <rect x="104" y="150" width="104" height="14" rx="4"/>
    <rect x="112" y="160" width="88" height="104"/>
    <!-- котёл и дымовая коробка -->
    <rect x="196" y="198" width="210" height="64" rx="10"/>
    <rect x="392" y="190" width="30" height="76" rx="8"/>
    <!-- труба -->
    <path d="M374 194 L378 160 L370 150 L406 150 L398 160 L402 194 Z"/>
    <!-- сухопарник и песочница -->
    <rect x="300" y="178" width="34" height="24" rx="11"/>
    <rect x="248" y="183" width="28" height="19" rx="9"/>
    <!-- прожектор -->
    <rect x="404" y="172" width="22" height="18" rx="3"/>
    <!-- рама -->
    <rect x="104" y="262" width="328" height="14" rx="3"/>
    <!-- скотосбрасыватель -->
    <path d="M424 270 L458 334 L410 334 Z"/>
  </g>
  <!-- окно будки и фара -->
  <rect class="dark" x="132" y="176" width="48" height="40" rx="4"/>
  <circle cx="426" cy="181" r="5" fill="#ffd77a"/>

  <!-- колёса: ведущие, бегунковое, поддерживающее -->
  <g fill="#1b1611" stroke="#efe4c8" stroke-width="9">
    <circle cx="204" cy="300" r="30"/>
    <circle cx="272" cy="300" r="30"/>
    <circle cx="340" cy="300" r="30"/>
    <circle cx="398" cy="316" r="15"/>
    <circle cx="140" cy="314" r="17"/>
  </g>
  <!-- спарник и ступицы -->
  <rect class="cream" x="200" y="296" width="144" height="8" rx="4"/>
  <g class="cream">
    <circle cx="204" cy="300" r="7"/>
    <circle cx="272" cy="300" r="7"/>
    <circle cx="340" cy="300" r="7"/>
  </g>

  <!-- рельс -->
  <rect class="cream" x="40" y="333" width="432" height="7" rx="2"/>

  <!-- лента-триколор -->
  <rect x="40" y="348" width="432" height="13" fill="#ffffff"/>
  <rect x="40" y="361" width="432" height="13" fill="#1c4fb5"/>
  <rect x="40" y="374" width="432" height="13" fill="#d52b1e"/>

  <text class="ru" x="256" y="456" text-anchor="middle">РУСИФИКАТОР</text>
</svg>
